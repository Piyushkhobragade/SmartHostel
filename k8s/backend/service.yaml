apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: smart-hostel

  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api

spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
