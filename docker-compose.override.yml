# Local development overrides — applied automatically by docker compose.
# Production deployments use docker-compose.yml directly (no override).
services:

  backend:
    build:
      target: builder
    command: npm run dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/dev.db}
      JWT_SECRET: ${JWT_SECRET:-smarthostel-default-development-jwt-secret-key-12345}
      NODE_ENV: development
      PORT: ${PORT:-3000}
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma
    ports:
      - "3000:3000"

  frontend:
    environment:
      NODE_ENV: development
    ports:
      - "80:80"
