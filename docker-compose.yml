services:

  backend:
    build:
      context: ./backend
      target: runtime
    image: smarthostel-backend:local
    container_name: smarthostel-backend
    env_file: ./backend/.env
    volumes:
      - sqlite_data:/app/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: smarthostel-frontend:local
    container_name: smarthostel-frontend
    ports:
      - "80:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  sqlite_data:
