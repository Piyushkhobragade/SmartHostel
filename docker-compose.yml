services:

  postgres:
    image: postgres:16-alpine
    container_name: smarthostel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthostel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthostel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smarthosteldb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthostel} -d ${POSTGRES_DB:-smarthosteldb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: smarthostel-ollama
    # Auto-pull the configured model on first start.
    # OLLAMA_MODEL env var controls which model is used (default: qwen2.5:3b).
    # First run downloads ~5 GB and may take 5-15 minutes.
    entrypoint: ["/bin/sh", "-c",
      "ollama serve &
       SERVE_PID=$!
       echo '[Ollama] Waiting for server to start...'
       sleep 8
       MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
       if ! ollama list 2>/dev/null | grep -q \"$MODEL\"; then
         echo \"[Ollama] Pulling model $MODEL (this may take several minutes)...\"
         ollama pull $MODEL && echo \"[Ollama] Model $MODEL ready.\" || echo \"[Ollama] WARNING: Model pull failed. Check logs.\"
       else
         echo \"[Ollama] Model $MODEL already present. Skipping pull.\"
       fi
       wait $SERVE_PID"
    ]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      # Checks that Ollama API is responding (does not require model to be loaded)
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # GPU support (optional — uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      target: runtime
    image: smarthostel-backend:local
    container_name: smarthostel-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthostel}:${POSTGRES_PASSWORD:-smarthostel_secret}@postgres:5432/${POSTGRES_DB:-smarthosteldb}
      JWT_SECRET: ${JWT_SECRET:-smarthostel-default-production-jwt-secret-key-12345}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: smarthostel-frontend:local
    container_name: smarthostel-frontend
    ports:
      - "80:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:

