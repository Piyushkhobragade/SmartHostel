name: Publish & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:

  # ── 1. CI Gate ──────────────────────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ── 2. Build & Push images to GHCR ─────────────────────────────────────────
  publish:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: ghcr.io/${{ github.repository_owner }}/smarthostel-backend
          - service: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository_owner }}/smarthostel-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          platforms: linux/amd64

  # ── 3. Auto-Deploy to AWS EC2 ───────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: publish          # Only deploy after images are pushed
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.AWS_HOST }}
          username:    ${{ secrets.AWS_USER }}
          key:         ${{ secrets.AWS_SSH_KEY }}
          timeout:     300s
          script: |
            set -e
            echo "═══════════════════════════════════════════════════"
            echo "  🚀 Auto-deploying SmartHostel from GitHub Actions"
            echo "═══════════════════════════════════════════════════"

            cd ~/SmartHostel

            # Pull latest code
            echo "▶ Pulling latest code..."
            git pull origin main

            # Run the setup/fix script (handles .env, swap, cleanup)
            echo "▶ Running setup script..."
            sudo bash setup-aws.sh

            echo "✅ Deployment complete!"
