# ─── SmartHostel — Production Compose (AWS) ──────────────────────────────────
# This file is designed for deployment on AWS EC2 Free Tier (t2.micro, 1GB RAM).
# It pulls pre-built images from GitHub Container Registry (GHCR) instead of
# building on the server, which avoids the CPU/RAM bottleneck.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# First time only — login to GHCR (uses a GitHub PAT with read:packages scope):
#   echo $GHCR_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: smarthostel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthostel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthostel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smarthosteldb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthostel} -d ${POSTGRES_DB:-smarthosteldb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/piyushkhobragade/smarthostel-backend:latest
    container_name: smarthostel-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthostel}:${POSTGRES_PASSWORD:-smarthostel_secret}@postgres:5432/${POSTGRES_DB:-smarthosteldb}
      JWT_SECRET: ${JWT_SECRET:-smarthostel-default-production-jwt-secret-key-12345}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/piyushkhobragade/smarthostel-frontend:latest
    container_name: smarthostel-frontend
    ports:
      - "80:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
